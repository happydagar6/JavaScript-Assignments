<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter using HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Counter using HTML</h1>
        
        <p class="count-text">Your Current Count is : <span id="count">0</span></p>
        
        <p id="error-msg" class="error-text" style="display: none;">Error : Cannot go below 0</p>
        
        <div class="button-group">
            <button id="decrement-btn" class="btn btn-light">Decrement</button>
            <button id="increment-btn" class="btn btn-light">Increment</button>
            <button id="clear-btn" class="btn btn-dark" style="display: none;">Clear</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
